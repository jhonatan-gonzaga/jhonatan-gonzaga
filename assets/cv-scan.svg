<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Painel de visao computacional</title>
  <desc id="desc">Interface escura com grade, caixas de deteccao, pontos de rastreamento e linha de varredura animada.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="0.48" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="130" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22c55e" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#22c55e" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="stroke" x1="90" y1="80" x2="1110" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="0.5" stop-color="#06b6d4"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(250 100) rotate(66) scale(360 250)">
      <stop stop-color="#22c55e" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(930 315) rotate(130) scale(360 260)">
      <stop stop-color="#06b6d4" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M 44 0 H 0 V 44" stroke="#1f2937" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .scan-line {
        animation: scanMove 4.4s linear infinite;
      }
      .pulse {
        animation: pulse 2.6s ease-in-out infinite;
      }
      .float-a {
        animation: floatA 7s ease-in-out infinite;
      }
      .float-b {
        animation: floatB 6.5s ease-in-out infinite;
      }
      @keyframes scanMove {
        0% { transform: translateY(-150px); opacity: 0; }
        12% { opacity: 0.9; }
        88% { opacity: 0.9; }
        100% { transform: translateY(450px); opacity: 0; }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.45; }
        50% { opacity: 1; }
      }
      @keyframes floatA {
        0%, 100% { transform: translate(0, 0); }
        50% { transform: translate(10px, -8px); }
      }
      @keyframes floatB {
        0%, 100% { transform: translate(0, 0); }
        50% { transform: translate(-8px, 10px); }
      }
      text {
        font-family: "Fira Code", "JetBrains Mono", "Courier New", monospace;
      }
    </style>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="28" fill="url(#grid)" opacity="0.55"/>
  <rect width="1200" height="420" rx="28" fill="url(#glowA)"/>
  <rect width="1200" height="420" rx="28" fill="url(#glowB)"/>

  <g opacity="0.55">
    <path d="M130 78H1070" stroke="url(#stroke)" stroke-width="1"/>
    <path d="M130 342H1070" stroke="url(#stroke)" stroke-width="1"/>
    <path d="M130 78V342" stroke="url(#stroke)" stroke-width="1"/>
    <path d="M1070 78V342" stroke="url(#stroke)" stroke-width="1"/>
  </g>

  <g class="scan-line">
    <rect x="0" y="0" width="1200" height="130" fill="url(#scan)"/>
    <path d="M80 70H1120" stroke="#22c55e" stroke-width="2" stroke-opacity="0.75" filter="url(#softGlow)"/>
  </g>

  <g class="float-a" filter="url(#softGlow)">
    <rect x="112" y="112" width="250" height="148" rx="18" stroke="#22c55e" stroke-width="2.5" stroke-dasharray="12 8"/>
    <path d="M112 144V112H144" stroke="#d1fae5" stroke-width="4" stroke-linecap="round"/>
    <path d="M362 144V112H330" stroke="#d1fae5" stroke-width="4" stroke-linecap="round"/>
    <path d="M112 228V260H144" stroke="#d1fae5" stroke-width="4" stroke-linecap="round"/>
    <path d="M362 228V260H330" stroke="#d1fae5" stroke-width="4" stroke-linecap="round"/>
    <text x="132" y="295" fill="#bbf7d0" font-size="17">bbox: estudos_visuais</text>
    <text x="132" y="320" fill="#67e8f9" font-size="15">conf: 0.94</text>
  </g>

  <g class="float-b" filter="url(#softGlow)">
    <rect x="852" y="126" width="225" height="168" rx="18" stroke="#06b6d4" stroke-width="2.5"/>
    <path d="M852 160V126H886" stroke="#cffafe" stroke-width="4" stroke-linecap="round"/>
    <path d="M1077 160V126H1043" stroke="#cffafe" stroke-width="4" stroke-linecap="round"/>
    <path d="M852 260V294H886" stroke="#cffafe" stroke-width="4" stroke-linecap="round"/>
    <path d="M1077 260V294H1043" stroke="#cffafe" stroke-width="4" stroke-linecap="round"/>
    <text x="872" y="329" fill="#cffafe" font-size="17">tracking: software_ia</text>
    <text x="872" y="354" fill="#a5b4fc" font-size="15">pipeline: pixels - modelo</text>
  </g>

  <g opacity="0.9">
    <text x="430" y="150" fill="#f8fafc" font-size="38" font-weight="700" letter-spacing="1">JHONATAN GONZAGA</text>
    <text x="432" y="188" fill="#67e8f9" font-size="18">ENGENHARIA DE SOFTWARE | UFAM</text>
    <text x="432" y="224" fill="#bbf7d0" font-size="16">visao_computacional.detect(frame)</text>
    <rect x="432" y="246" width="328" height="10" rx="5" fill="#1f2937"/>
    <rect x="432" y="246" width="236" height="10" rx="5" fill="#22c55e" class="pulse"/>
    <text x="432" y="285" fill="#94a3b8" font-size="15">input: imagem | output: insight visual</text>
  </g>

  <g fill="#e0f2fe" filter="url(#softGlow)">
    <circle cx="492" cy="102" r="4" class="pulse"/>
    <circle cx="706" cy="102" r="3"/>
    <circle cx="742" cy="312" r="4" class="pulse"/>
    <circle cx="584" cy="326" r="3"/>
    <circle cx="940" cy="92" r="3"/>
    <circle cx="250" cy="334" r="4" class="pulse"/>
  </g>

  <g stroke="#334155" stroke-width="1.2" opacity="0.75">
    <path d="M492 102L706 102L742 312L584 326L492 102"/>
    <path d="M706 102L940 92L742 312"/>
    <path d="M250 334L584 326"/>
  </g>
</svg>
